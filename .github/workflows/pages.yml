name: Publish sample docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  DITA_OT_IMAGE: quay.io/rhn_support_aireilly/dita-ot

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Package plugin
        run: git archive --format=zip --prefix=org.dita-community.codeinclude/ -o "$RUNNER_TEMP/plugin.zip" HEAD

      - name: Pull DITA-OT image
        run: podman pull "$DITA_OT_IMAGE"

      - name: Install plugin and build sample
        run: |
          mkdir -p _site
          podman run --rm \
            -v "$PWD:/src:ro" \
            -v "$RUNNER_TEMP/plugin.zip:/plugin.zip:ro" \
            -v "$PWD/_site:/out" \
            "$DITA_OT_IMAGE" \
            sh -c 'dita install /plugin.zip && dita -i /src/samples/codeinclude-sample.ditamap -f html5 -o /out --codeinclude.local.root=/src --codeinclude.fail-on-error=yes'
          test -f _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
